name: Verify simulator
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[dev,models]'
      - run: pytest -q
      - run: npm ci && npm run build
        working-directory: web
      - run: duplex-arena evaluate --seconds 1 --output runs/ci
      - run: python examples/on_policy.py --episodes 2 --horizon 10 --output runs/gates-ci
