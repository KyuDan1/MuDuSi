<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title description">
  <title id="title">MuDuSi — Multi-agent Duplex Simulator</title>
  <desc id="description">A cream banner with a forest-green project title and three connected circles in sage, lavender, and apricot, representing independent agents sharing one acoustic space.</desc>
  <rect width="1000" height="220" rx="16" fill="#FAF8F2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#28483D">
    <text x="48" y="105" font-size="58" font-weight="650" letter-spacing="-1.5">MuDuSi</text>
    <text x="50" y="146" font-size="22" font-weight="400">Multi-agent Duplex Simulator</text>
  </g>
  <g stroke="#66786F" stroke-width="2" fill="none" opacity="0.55">
    <path d="M760 66 883 106 781 160Z"/>
  </g>
  <g stroke="#28483D" stroke-width="1.5">
    <circle cx="760" cy="66" r="26" fill="#B7D7C0"/>
    <circle cx="883" cy="106" r="26" fill="#C9C0E8"/>
    <circle cx="781" cy="160" r="26" fill="#E8C6AA"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#28483D">
    <text x="760" y="72">1</text>
    <text x="883" y="112">2</text>
    <text x="781" y="166">3</text>
  </g>
</svg>
